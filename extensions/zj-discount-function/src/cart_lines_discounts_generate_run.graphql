# Keep this query minimal: every field costs instructions to deserialize for every
# cart line (see scripts/function-perf.mjs). Only what the rule evaluation needs.
query CartInput($collectionIds: [ID!]) {
  presentmentCurrencyRate
  cart {
    cost {
      subtotalAmount {
        currencyCode
      }
    }
    lines {
      id
      quantity
      cost {
        subtotalAmount {
          amount
        }
      }
      merchandise {
        ... on ProductVariant {
          product {
            inAnyCollection(ids: $collectionIds)
          }
        }
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "$app", key: "rule-config") {
      jsonValue
    }
  }
}
